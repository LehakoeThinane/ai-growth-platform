name: CI

on:
    push:
        branches:
            - Dev
            - Main

    pull_request:
        branches:
            - Dev
            - Main

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: Restore dependencies
              run: dotnet restore AiGrowthPlatform.slnx

            - name: Build solution
              run: dotnet build AiGrowthPlatform.slnx --no-restore --configuration Release

            - name: Run tests
              run: dotnet test AiGrowthPlatform.slnx --no-build --configuration Release
