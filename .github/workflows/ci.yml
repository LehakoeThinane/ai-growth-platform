name: CI

on:
    push:
        branches:
            - Dev
            - Main

    pull_request:
        branches:
            - Dev
            - Main

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            AI_GROWTH_TEST_POSTGRES: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: Restore dependencies
              run: dotnet restore AiGrowthPlatform.slnx

            - name: Build solution
              run: dotnet build AiGrowthPlatform.slnx --no-restore --configuration Release

            - name: Run tests
              run: dotnet test --solution AiGrowthPlatform.slnx --no-build --configuration Release
